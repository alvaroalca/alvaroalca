<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 192" width="430" height="192" role="img" aria-label="Comprobador de parcelas. Pincha una finca de cualquier parte de España y dice si cabe una casa, con el artículo de la ley que lo decide. Un adaptador por comunidad y 493 citas comprobadas.">
<style>
@font-face { font-family: 'head'; font-weight: 100 900; src: url(data:font/woff2;base64,) format('woff2'); }
@font-face { font-family: 'n400'; font-weight: 100 900; src: url(data:font/woff2;base64,) format('woff2'); }
@font-face { font-family: 'n600'; font-weight: 100 900; src: url(data:font/woff2;base64,) format('woff2'); }
@font-face { font-family: 'n700'; font-weight: 100 900; src: url(data:font/woff2;base64,) format('woff2'); }
:root { --paper:#191A1D; --ink:#E4E2DA; --soft:#B3B0A6; --muted:#8B887F; --accent:#E0453B; --rule:rgba(228,226,218,0.26); }
text { font-family: 'n400', Georgia, serif; fill: var(--ink); }
.kick  { font-family: 'n700', Georgia, serif; font-size: 11px; letter-spacing: 2.2px; fill: var(--accent); }
.meta  { font-family: 'n600', Georgia, serif; font-size: 10.5px; letter-spacing: 1.6px; fill: var(--muted); }
.label { font-family: 'n700', Georgia, serif; font-size: 10.5px; letter-spacing: 1.6px; fill: var(--accent); }
.title { font-family: 'm1', Georgia, serif; }
.head  { font-family: 'head', Georgia, serif; }
.soft  { fill: var(--soft); }
.cap   { font-family: 'n600', Georgia, serif; font-size: 10px; letter-spacing: 1.2px; fill: var(--muted); }
</style>
<defs><filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/>
</filter></defs>
<rect width="430" height="192" fill="var(--paper)"/><rect width="430" height="192" filter="url(#grain)" opacity="0.07" style="mix-blend-mode: overlay"/><rect x=".5" y=".5" width="429" height="191" fill="none" stroke="var(--rule)"/>
<text class="kick" x="22" y="34">URBANISMO · DATOS ABIERTOS</text><text class="meta" x="408" y="34" text-anchor="end"></text><text class="head" x="22" y="66" style="font-size:25px">Comprobador de parcelas</text><text class="soft" x="22" y="92" style="font-size:14.5px">Pincha una finca de cualquier parte de España y dice si cabe</text><text class="soft" x="22" y="112" style="font-size:14.5px">una casa, con el artículo de la ley que lo decide. Un adaptador</text><text class="soft" x="22" y="132" style="font-size:14.5px">por comunidad y 493 citas comprobadas.</text><rect x="22" y="154" width="386" height="1" fill="var(--rule)"/><text class="meta" x="22" y="176">JAVASCRIPT · MAPLIBRE · WORKERS</text><text class="label" x="335.2" y="176">CÓDIGO</text><path d="M397 172.4h10m-3.6-3.4 3.6 3.4-3.6 3.4" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>