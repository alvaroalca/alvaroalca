<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 116" width="212" height="116" role="img" aria-label="Este portfolio. Sin frameworks, CSP estricta y panel propio.">
<style>
@font-face { font-family: 'head'; font-weight: 100 900; src: url(data:font/woff2;base64,) format('woff2'); }
@font-face { font-family: 'n400'; font-weight: 100 900; src: url(data:font/woff2;base64,) format('woff2'); }
@font-face { font-family: 'n700'; font-weight: 100 900; src: url(data:font/woff2;base64,) format('woff2'); }
:root { --paper:#191A1D; --ink:#E4E2DA; --soft:#B3B0A6; --muted:#8B887F; --accent:#E0453B; --rule:rgba(228,226,218,0.26); }
text { font-family: 'n400', Georgia, serif; fill: var(--ink); }
.kick  { font-family: 'n700', Georgia, serif; font-size: 11px; letter-spacing: 2.2px; fill: var(--accent); }
.meta  { font-family: 'n600', Georgia, serif; font-size: 10.5px; letter-spacing: 1.6px; fill: var(--muted); }
.label { font-family: 'n700', Georgia, serif; font-size: 10.5px; letter-spacing: 1.6px; fill: var(--accent); }
.title { font-family: 'm1', Georgia, serif; }
.head  { font-family: 'head', Georgia, serif; }
.soft  { fill: var(--soft); }
.cap   { font-family: 'n600', Georgia, serif; font-size: 10px; letter-spacing: 1.2px; fill: var(--muted); }
</style>
<defs><filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/>
</filter></defs>
<rect width="212" height="116" fill="var(--paper)"/><rect width="212" height="116" filter="url(#grain)" opacity="0.07" style="mix-blend-mode: overlay"/><rect x=".5" y=".5" width="211" height="115" fill="none" stroke="var(--rule)"/>
<text class="head" x="16" y="34" style="font-size:18px">Este portfolio</text><text class="soft" x="16" y="56" style="font-size:12.5px">Sin frameworks, CSP estricta y</text><text class="soft" x="16" y="73" style="font-size:12.5px">panel propio.</text><text class="label" x="134.1" y="100">FICHA</text><path d="M185 96.4h10m-3.6-3.4 3.6 3.4-3.6 3.4" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>