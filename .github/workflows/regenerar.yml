name: Regenerar perfil

# Cada día: fecha de la cabecera (edición diaria del periódico) y estrellas de los repos.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit si algo cambió
        run: |
          git add -A assets README.md
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "Álvaro Alcaraz"
          git config user.email "alvaroalca@users.noreply.github.com"
          git commit -m "perfil: edición del $(date -u +%F)"
          git push
